# Intranet Terranova · solo en la IP privada de srv-render
# El tráfico de la VPN llega sin NAT, así que la IP de origen dice el grupo.
geo $grupo {
    default        desconocido;
    10.0.0.0/16    interna;
    10.10.1.0/27   arquitectos;
    10.10.1.32/28  ingenieros;
    10.10.1.48/29  ti;
    10.10.1.64/28  visitantes;
}

server {
    listen 10.0.0.37:80;
    server_name intranet.terranova.local;
    root /var/www/intranet;
    index index.html;
    server_tokens off;
    charset utf-8;

    # SSI: escribe en la página el grupo, la IP y la hora del servidor
    ssi on;

    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location = /archivo.woff2 {
        types { font/woff2 woff2; }
        add_header Cache-Control "public, max-age=604800";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
