# /etc/openvpn/server/server.conf  (fw-vpn, 10.0.0.20)
# Estado: documentado para la Fase 3, no desplegado en la Fase 2.

port 1194
proto udp
dev tun

ca ca.crt
cert server.crt
key server.key
dh none
tls-crypt tc.key

# Pool de la VPN según la Fase 1: 10.10.0.0/23, servidor en 10.10.0.1.
# Sin pool dinámico: cada usuario recibe una IP fija del rango de su
# departamento (archivos en ccd/). Solo entran usuarios con archivo en ccd/.
#   Arquitectos 10.10.1.0/27   (10.10.1.1  - 10.10.1.30)
#   Ingenieros  10.10.1.32/28  (10.10.1.33 - 10.10.1.46)
#   TI          10.10.1.48/29  (10.10.1.49 - 10.10.1.54)
topology subnet
server 10.10.0.0 255.255.254.0 nopool
client-config-dir /etc/openvpn/server/ccd
ccd-exclusive

# Los clientes llegan a toda la red de la nube (10.0.0.0/16) por el túnel
push "route 10.0.0.0 255.255.0.0"
# Cuando BIND9 esté listo en fw-vpn:
# push "dhcp-option DNS 10.0.0.20"

keepalive 10 120
user nobody
group nogroup
persist-key
persist-tun
verb 3
explicit-exit-notify 1
