# Página pública de Terranova · srv-web (DMZ)
# Llega por el DNAT de fw-vpn (puertos 80 y 443). Certbot agrega el bloque 443 y la redirección a HTTPS
# cuando el dominio apunte a la IP pública de fw-vpn.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/terranova;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location / {
        try_files $uri $uri/ =404;
    }
}
