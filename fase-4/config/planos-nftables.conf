#!/usr/sbin/nft -f
# srv-planos · Terranova Fase 4 · solo los puertos que se usan
table inet filtro
delete table inet filtro

table inet filtro {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    udp sport 67 udp dport 68 accept
    # TI llega a todo (incluye Grafana en el 3000)
    ip saddr 10.10.1.48/29 accept
    # SSH y SFTP: administración (fw-vpn), Arquitectos e Ingenieros
    tcp dport 22 ip saddr { 10.0.0.20, 10.10.1.0/27, 10.10.1.32/28 } accept
    # LDAP: fw-vpn (login VPN) y srv-render (SSSD)
    tcp dport { 389, 636 } ip saddr { 10.0.0.20, 10.0.0.37 } accept
    # NFS: srv-render guarda los renders
    tcp dport 2049 ip saddr 10.0.0.37 accept
    icmp type echo-request ip saddr { 10.0.0.16/28, 10.0.0.32/28, 10.10.1.0/27, 10.10.1.32/28 } accept
    counter
  }
}
