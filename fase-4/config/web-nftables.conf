#!/usr/sbin/nft -f
# srv-web (DMZ) · Terranova Fase 4 · solo la web es pública
table inet filtro
delete table inet filtro

table inet filtro {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    udp sport 67 udp dport 68 accept
    # Página pública
    tcp dport { 80, 443 } accept
    # SSH solo desde fw-vpn y TI
    tcp dport 22 ip saddr { 10.0.0.20, 10.10.1.48/29 } accept
    # SNMP solo desde el colector
    udp dport 161 ip saddr 10.0.0.36 accept
    icmp type echo-request ip saddr { 10.0.0.20, 10.10.1.48/29 } accept
    counter
  }
}
