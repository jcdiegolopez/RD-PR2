#!/usr/sbin/nft -f
# srv-render · Terranova Fase 4 · solo los puertos que se usan
table inet filtro
delete table inet filtro

table inet filtro {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    udp sport 67 udp dport 68 accept
    # TI llega a todo
    ip saddr 10.10.1.48/29 accept
    # SSH: administración (fw-vpn), srv-planos y Arquitectos
    tcp dport 22 ip saddr { 10.0.0.20, 10.0.0.36, 10.10.1.0/27 } accept
    # Intranet: Firewall, Servidores, Arquitectos e Ingenieros (no DMZ ni Visitantes)
    tcp dport 80 ip saddr { 10.0.0.16/28, 10.0.0.32/28, 10.10.1.0/27, 10.10.1.32/28 } accept
    # SNMP solo desde el colector
    udp dport 161 ip saddr 10.0.0.36 accept
    icmp type echo-request ip saddr { 10.0.0.16/28, 10.0.0.32/28, 10.10.1.0/27, 10.10.1.32/28 } accept
    counter
  }
}
